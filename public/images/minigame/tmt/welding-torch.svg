<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300">
  <!-- Handle -->
  <rect x="85" y="100" width="30" height="100" fill="#555555" rx="3"/>
  
  <!-- Grip texture -->
  <line x1="85" y1="115" x2="115" y2="115" stroke="#333333" stroke-width="2"/>
  <line x1="85" y1="130" x2="115" y2="130" stroke="#333333" stroke-width="2"/>
  <line x1="85" y1="145" x2="115" y2="145" stroke="#333333" stroke-width="2"/>
  <line x1="85" y1="160" x2="115" y2="160" stroke="#333333" stroke-width="2"/>
  <line x1="85" y1="175" x2="115" y2="175" stroke="#333333" stroke-width="2"/>
  
  <!-- Cable connection -->
  <path d="M 100 100 Q 60 80 40 20" stroke="#FF4500" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Nozzle/Head -->
  <rect x="75" y="50" width="50" height="20" fill="#888888" rx="2"/>
  
  <!-- Tip cone -->
  <polygon points="100,50 85,30 115,30" fill="#CCCCCC"/>
  
  <!-- Arc indicator (glowing effect) -->
  <circle cx="100" cy="25" r="8" fill="#FFD700" opacity="0.7"/>
  <circle cx="100" cy="25" r="5" fill="#FFFF00"/>
  
  <!-- Sparks around tip -->
  <circle cx="85" cy="15" r="2" fill="#FF6600"/>
  <circle cx="115" cy="18" r="2" fill="#FF6600"/>
  <circle cx="95" cy="10" r="1.5" fill="#FFD700"/>
</svg>
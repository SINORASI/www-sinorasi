<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- Left metal plate -->
  <rect x="20" y="40" width="150" height="120" fill="#808080" stroke="#404040" stroke-width="2"/>
  
  <!-- Metallic gradient texture on left plate -->
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A0A0A0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#808080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#606060;stop-opacity:1" />
    </linearGradient>
    <pattern id="brushed" x="0" y="0" width="4" height="100" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="100" stroke="#707070" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  
  <rect x="20" y="40" width="150" height="120" fill="url(#metalGrad)"/>
  <rect x="20" y="40" width="150" height="120" fill="url(#brushed)"/>
  
  <!-- Right metal plate -->
  <rect x="230" y="40" width="150" height="120" fill="#808080" stroke="#404040" stroke-width="2"/>
  <rect x="230" y="40" width="150" height="120" fill="url(#metalGrad)"/>
  <rect x="230" y="40" width="150" height="120" fill="url(#brushed)"/>
  
  <!-- Gap between plates (joint line) -->
  <line x1="170" y1="40" x2="230" y2="40" stroke="#505050" stroke-width="1" opacity="0.5"/>
  <line x1="200" y1="100" x2="200" y2="160" stroke="#FF6600" stroke-width="3" opacity="0.6" stroke-dasharray="5,5"/>
  
  <!-- Heat discoloration indicator -->
  <rect x="190" y="95" width="20" height="70" fill="#FF4500" opacity="0.2"/>
  
  <!-- Weld pool indicator (circular glow) -->
  <circle cx="200" cy="100" r="15" fill="#FFD700" opacity="0.1"/>
  <circle cx="200" cy="100" r="10" fill="#FFFF00" opacity="0.05"/>
</svg>